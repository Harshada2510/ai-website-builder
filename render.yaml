# Render Blueprint reference for the AI Website Generator web service.
# IMPORTANT: Review before use. Do NOT auto-create paid resources without approval.
# This file does NOT include secrets. Set all secrets in Render Dashboard > Environment.
# MySQL should be provisioned as a Render private MySQL service per https://render.com/docs/deploy-mysql

services:
  - type: web
    name: ai-website-generator
    runtime: docker
    plan: starter
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: APP_NAME
        value: "AI Website Generator"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_KEY
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: /etc/ssl/certs/tidb-ca.pem
      - key: TIDB_CA_SECRET_FILE
        value: /etc/secrets/tidb-ca.pem
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-3.5-flash-lite
      - key: AI_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: AI_TIMEOUT
        value: "120"
      - key: RUN_MIGRATIONS
        value: "false"
    disk:
      name: ai-website-generator-uploads
      mountPath: /var/www/html/storage/app/private
      sizeGB: 1
